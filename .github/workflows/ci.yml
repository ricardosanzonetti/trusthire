name: TrustHire CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_DB: trusthire
          POSTGRES_USER: trusthire
          POSTGRES_PASSWORD: trusthire

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: trusthire
      POSTGRES_USER: trusthire
      POSTGRES_PASSWORD: trusthire
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install ruff

      - name: Run Ruff
        run: |
          cd backend
          ruff check .

      - name: Run migrations
        run: |
          cd backend
          PYTHONPATH=. alembic upgrade head
          
      - name: Run tests
        run: |
          cd backend
          PYTHONPATH=. pytest -v --cov=app --cov-report=term-missing